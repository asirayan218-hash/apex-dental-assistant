<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Support AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-[100dvh] m-0 font-sans overflow-hidden">

  <div class="w-full max-w-md h-full sm:h-[600px] flex flex-col sm:rounded-3xl border border-cyan-500/20 bg-[#0b1120] shadow-xl overflow-hidden">
    <div class="flex items-center justify-between border-b border-white/10 bg-slate-900/50 px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="h-3 w-3 rounded-full bg-emerald-500"></div>
        <h2 class="text-sm font-semibold text-white">Apex Assistant</h2>
      </div>
      <button onclick="toggleVoice()" class="text-xs text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/30">🎙️ <span id="vTxt">OFF</span></button>
    </div>

    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
      <div class="flex items-start gap-3">
        <div class="h-7 w-7 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-xs text-cyan-400 font-bold">AI</div>
        <div class="rounded-2xl rounded-tl-sm bg-slate-900 border border-white/5 px-4 py-3 text-slate-300 max-w-[80%]">
          Hello! Welcome to Apex Dental Clinic. How can I help you today?
        </div>
      </div>
    </div>

    <div class="border-t border-white/10 bg-slate-900/50 p-4 flex gap-2">
      <input type="text" id="userInput" placeholder="Type a message..." class="flex-1 rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
      <button onclick="sendMessage()" class="rounded-xl bg-cyan-500 px-5 py-3 text-sm font-semibold text-white hover:opacity-90">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    let history = [], isVoice = false;

    function toggleVoice() {
      isVoice = !isVoice;
      document.getElementById("vTxt").textContent = isVoice ? "ON" : "OFF";
    }

    function appendMsg(sender, text, isErr = false) {
      const div = document.createElement("div");
      div.className = sender === "user" ? "flex justify-end gap-3" : "flex gap-3";
      div.innerHTML = sender === "user" 
        ? `<div class="bg-cyan-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm max-w-[80%]">${text}</div>`
        : `<div class="h-7 w-7 rounded-full bg-cyan-500/20 flex items-center justify-center text-xs text-cyan-400 font-bold">AI</div><div class="bg-slate-900 border ${isErr?'border-red-500 text-red-400':'border-white/5 text-slate-300'} px-4 py-3 rounded-2xl rounded-tl-sm max-w-[80%]">${text}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      appendMsg("user", text);
      userInput.value = "";

      const loading = appendMsg("ai", "Thinking...");

      try {
        const res = await fetch("https://kswvgpflvxjrkawpnizr.supabase.co/functions/v1/hello-world", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer sb_publishable_Jc6AHEqtLVVW6WI39O3JdQ_BtDiGVuh",
            "apikey": "sb_publishable_Jc6AHEqtLVVW6WI39O3JdQ_BtDiGVuh"
          },
          body: JSON.stringify({ message: text, history })
        });

        const data = await res.json();
        loading.remove();

        if (!res.ok) throw new Error(data.error || "Server Error");

        appendMsg("ai", data.reply);
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.reply });

        if (isVoice) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(data.reply.replace(/[*_]/g, "")));
        }
      } catch (err) {
        loading.remove();
        appendMsg("ai", err.message, true);
      }
    }

    userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Support AI - Voice Enabled</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-[100dvh] m-0 font-sans overflow-hidden">

  <!-- Chat Widget Container -->
  <div class="w-full max-w-md h-full sm:h-[600px] flex flex-col sm:rounded-3xl border border-cyan-500/20 bg-[#0b1120] shadow-[0_0_40px_rgba(6,182,212,0.15)] overflow-hidden">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-white/10 bg-slate-900/50 px-6 py-4 backdrop-blur-md flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="h-3 w-3 rounded-full bg-emerald-500"></div>
          <div class="absolute inset-0 h-3 w-3 animate-ping rounded-full bg-emerald-400 opacity-75"></div>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-white">Apex Assistant</h2>
          <p id="callStatus" class="text-xs text-slate-400">Online & Ready</p>
        </div>
      </div>
      <button type="button" onclick="toggleVoiceMode()" class="rounded-full border border-cyan-500/30 bg-cyan-500/10 px-3 py-1 text-xs font-medium text-cyan-400 hover:bg-cyan-500/20 transition flex items-center gap-1.5 cursor-pointer">
        🎙️ <span id="voiceBtnText">Voice: OFF</span>
      </button>
    </div>

    <!-- Chat Messages Box -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
      <div class="flex items-start gap-3">
        <div class="h-7 w-7 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-xs text-cyan-400 font-bold flex-shrink-0">AI</div>
        <div class="rounded-2xl rounded-tl-sm bg-slate-900 border border-white/5 px-4 py-3 text-slate-300 max-w-[80%] leading-relaxed">
          Hello! Welcome to Apex Dental Clinic. I am your support assistant. How can I help you with your dental care today?
        </div>
      </div>
    </div>

    <!-- Input Bar -->
    <div class="border-t border-white/10 bg-slate-900/50 p-4 backdrop-blur-md flex gap-2 flex-shrink-0">
      <input type="text" id="userInput" placeholder="Type or use mic..." autocomplete="off" class="flex-1 rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-sm text-white placeholder-slate-500 focus:border-cyan-400 focus:outline-none">
      <button type="button" onclick="startListening()" class="rounded-xl border border-cyan-500/30 bg-cyan-500/10 px-4 text-cyan-400 hover:bg-cyan-500/20 transition text-lg cursor-pointer flex-shrink-0" title="Speak">🎙️</button>
      <button type="button" onclick="sendMessage()" class="rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-500/20 hover:opacity-90 transition cursor-pointer flex-shrink-0">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const callStatus = document.getElementById("callStatus");
    const voiceBtnText = document.getElementById("voiceBtnText");

    let history = [];
    let isVoiceMode = false;

    function toggleVoiceMode() {
      isVoiceMode = !isVoiceMode;
      voiceBtnText.textContent = isVoiceMode ? "Voice: ON" : "Voice: OFF";
      callStatus.textContent = isVoiceMode ? "🔊 Auto-Speak Active" : "Online & Ready";
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition not supported.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onstart = () => { callStatus.textContent = "Listening..."; };
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        callStatus.textContent = isVoiceMode ? "🔊 Auto-Speak Active" : "Online & Ready";
        sendMessage();
      };
      recognition.start();
    }

    function appendMessage(sender, text, isError = false) {
      const wrapper = document.createElement("div");
      wrapper.className = sender === "user" ? "flex items-start justify-end gap-3" : "flex items-start gap-3";

      if (sender === "user") {
        wrapper.innerHTML = `<div class="rounded-2xl rounded-tr-sm bg-cyan-600 px-4 py-3 text-white max-w-[80%] leading-relaxed"></div>`;
        wrapper.querySelector("div").textContent = text;
      } else if (isError) {
        wrapper.innerHTML = `
          <div class="h-7 w-7 rounded-full bg-red-500/20 border border-red-500/30 flex items-center justify-center text-xs text-red-400 font-bold flex-shrink-0">!</div>
          <div class="rounded-2xl rounded-tl-sm bg-slate-900 border border-red-500/20 px-4 py-3 text-red-400 max-w-[80%] text-xs">
            <strong>Error:</strong> <span class="err-text"></span>
          </div>
        `;
        wrapper.querySelector(".err-text").textContent = text;
      } else {
        wrapper.innerHTML = `
          <div class="h-7 w-7 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-xs text-cyan-400 font-bold flex-shrink-0">AI</div>
          <div class="rounded-2xl rounded-tl-sm bg-slate-900 border border-white/5 px-4 py-3 text-slate-300 max-w-[80%] leading-relaxed ai-text"></div>
        `;
        wrapper.querySelector(".ai-text").textContent = text;
      }

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return wrapper;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";

      const loadingEl = appendMessage("ai", "Thinking...");
      const aiTextDiv = loadingEl.querySelector(".ai-text");
      if(aiTextDiv) {
        aiTextDiv.className = "rounded-2xl rounded-tl-sm bg-slate-900 border border-white/5 px-4 py-3 text-slate-400 italic ai-text";
      }

      try {
        const res = await fetch("https://kswvgpflvxjrkawpnizr.supabase.co/functions/v1/smooth-handler", {
          method: "POST",
          headers: { 
            "Authorization": "Bearer sb_publishable_Jc6AHEqtLVVW6WI39O3JdQ_BtDiGVuh",
            "apikey": "sb_publishable_Jc6AHEqtLVVW6WI39O3JdQ_BtDiGVuh",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text, history })
        });
        
        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          throw new Error("Server Response (Not JSON): " + rawText);
        }

        loadingEl.remove();

        if (!res.ok) {
          throw new Error(data.error || data.message || JSON.stringify(data));
        }

        const replyText = data.reply || data.message || "Done";
        appendMessage("ai", replyText);

        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: replyText });

        if (isVoiceMode) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(replyText.replace(/[*_\[\]()]/g, "")));
        }

      } catch (err) {
        loadingEl.remove();
        appendMessage("ai", err.message, true);
      }
    }

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
